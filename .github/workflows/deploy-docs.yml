name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Rebuild the current day's result every morning in Europe/Warsaw.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Revision dates are derived from each document's Git history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Generate mirror days
        run: uv run python scripts/generate_mirror_days.py

      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force
